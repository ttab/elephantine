syntax = "proto3";

package elephantine.testservice.v1;

option go_package = "github.com/ttab/elephantine/internal/testservice";

// Test is the fixture service the dual-stack tests in the rpc package are run
// against. It is generated with the same plugins and versions the fleet
// generates its services with.
service Test {
  // Echo returns the message it was given, together with what the service
  // could see of the caller.
  rpc Echo(EchoRequest) returns (EchoResponse);
  // Fail returns an error with the requested code and error metadata.
  rpc Fail(FailRequest) returns (FailResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  string subject = 2;
  // log_metadata is what the service could see of the request log metadata,
  // which is what the parity tests compare between the two stacks.
  map<string, string> log_metadata = 3;
}

message FailRequest {
  string code = 1;
}

message FailResponse {}
