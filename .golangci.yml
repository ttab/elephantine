version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    exhaustive:
      # A default case is enough to consider a type switch exhaustive; we
      # don't want to enumerate every reflect.Kind just to satisfy the linter.
      default-signifies-exhaustive: true
    godox:
      keywords:
        - FIXME
        - BUG
    modernize:
      disable:
        # embedlit suggests eliding the type of an embedded field in a
        # struct literal, which the Go 1.27 compiler rejects with "missing
        # type in composite literal".
        - embedlit
    nestif:
      min-complexity: 6
    wrapcheck:
      extra-ignore-sigs:
        - elephantine.InvalidArgumentf(
        - (context.Context).Err(
        - github.com/ttab/elephantine/pg.WithTX(
        # The rpc package's whole job is to produce errors that are already
        # coded RPC errors, and to move them between the two vocabularies.
        # Wrapping one of those turns it into an uncoded error.
        - github.com/ttab/elephantine/rpc.Errorf(
        - github.com/ttab/elephantine/rpc.InvalidArgument(
        - github.com/ttab/elephantine/rpc.InvalidArgumentf(
        - github.com/ttab/elephantine/rpc.RequiredArgument(
        - github.com/ttab/elephantine/rpc.NotFound(
        - github.com/ttab/elephantine/rpc.AlreadyExists(
        - github.com/ttab/elephantine/rpc.Unauthenticated(
        - github.com/ttab/elephantine/rpc.Internalf(
        - github.com/ttab/elephantine/rpc.FailedPreconditionf(
        - github.com/ttab/elephantine/rpc.PermissionDeniedf(
        - github.com/ttab/elephantine/rpc.WithMeta(
        - github.com/ttab/elephantine/rpc.ToTwirp(
        - github.com/ttab/elephantine/rpc.FromTwirp(
        - github.com/ttab/elephantine/rpc.RequireAnyScope(
        - github.com/ttab/elephantine/internal/auth.GetError(
        - github.com/ttab/elephantine/internal/rpcmetrics.New(
        - (*connectrpc.com/connect.Error).Unwrap(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [gosec]
        path: _test\.go$
      # Struct tags (e.g. the OpenID Connect discovery document) can push a
      # field declaration past the line limit with no way to wrap it.
      - linters: [lll]
        source: '`json:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
