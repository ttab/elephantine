version: "2"
sql:
- schema: "pg/joblock/schema.sql"
  queries: "pg/joblock/queries.sql"
  engine: "postgresql"
  gen:
    go:
      out: "pg/joblock/internal/postgres"
      sql_package: "pgx/v5"
      rename:
        uuid: UUID
      overrides:
        - db_type: "uuid"
          go_type: "github.com/google/uuid.UUID"
